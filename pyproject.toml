[project]
name = "pycpfcnpj"
dynamic = ["version"]
description = "Python module for brazilian register numbers for persons (CPF) and companies (CNPJ)."
authors = [{ name = "Matheus CAS", email = "matheus.mcas@gmail.com" }]
maintainers = [{ name = "Marcelo", email = "marcelo.majer@yahoo.com.br" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[tool.hatch.version]
path = "pycpfcnpj/__init__.py"

[dependency-groups]
dev = [
    "pytest>=7.4.4",
    "codecov>=2.1.13",
    "pytest-codecov>=0.5.1",
    "coverage>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
